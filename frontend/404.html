<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
      }

      main {
        max-width: 42rem;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 9vw, 5rem);
        line-height: 1;
      }

      p {
        margin: 0;
        font-size: clamp(1.1rem, 4vw, 1.6rem);
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>I bet you feel so smart typing this into the URL</p>
    </main>
  </body>
</html>
