<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP&display=swap" rel="stylesheet" />
    <title data-i18n="title.feed">StereoDamage - Лента</title>
    <script src="/i18n.js" defer></script>
    <script src="/theme.js" defer></script>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body data-page="feed">
    <header class="topbar">
      <div class="topbar-inner">
        <p class="brand-mark" data-i18n="brand.name">StereoDamage</p>
        <div class="topbar-actions">
          <nav aria-label="Основная навигация" data-i18n-aria-label="nav.mainAria">
            <a href="/" class="top-link active" data-i18n="nav.home">Главная</a>
          </nav>
          <button id="adminLogoutButton" class="top-action-button" type="button" hidden data-i18n="nav.logout">Выйти</button>
          <div class="settings-menu">
            <button
              id="readerSettingsToggle"
              class="settings-toggle"
              type="button"
              aria-label="Настройки"
              aria-controls="readerSettingsPanel"
              aria-expanded="false"
              data-i18n-aria-label="settings.open"
            >⚙️</button>
            <div id="readerSettingsPanel" class="settings-panel" hidden>
              <div class="settings-row">
                <span class="settings-label" data-i18n="settings.language">Язык</span>
                <div class="language-switch" role="group" aria-label="Переключение языка" data-i18n-aria-label="lang.switcherAria">
                  <button type="button" class="language-option" data-language-option="ru" aria-pressed="true">RU</button>
                  <button type="button" class="language-option" data-language-option="en" aria-pressed="false">EN</button>
                </div>
              </div>
              <div class="settings-row">
                <span class="settings-label" data-i18n="settings.theme">Тема</span>
                <button id="themeToggle" class="theme-toggle" type="button">Тема: Светлая</button>
              </div>
              <div class="settings-row">
                <span class="settings-label" data-i18n="settings.smoothScroll">Плавная прокрутка</span>
                <button id="smoothScrollToggle" class="settings-small-button" type="button" aria-pressed="false">Выкл</button>
              </div>
              <div class="settings-row">
                <span class="settings-label" data-i18n="settings.feedView">Вид ленты</span>
                <div class="feed-view-switch" role="group" aria-label="Вид ленты" data-i18n-aria-label="settings.feedView">
                  <button type="button" class="feed-view-option" data-feed-view-option="list" aria-pressed="true" data-i18n="settings.feedList">Лента</button>
                  <button type="button" class="feed-view-option" data-feed-view-option="grid" aria-pressed="false" data-i18n="settings.feedGrid">Плитки</button>
                </div>
              </div>
              <button id="resetReaderDataButton" class="settings-reset-button" type="button" data-i18n="settings.reset">Очистить мои настройки и прогресс</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <section class="panel timeline-panel">
        <header class="timeline-head">
          <h1 class="site-title" data-i18n="feed.title">Посты</h1>
          <p class="site-subtitle" data-i18n="feed.subtitle">Обратная хронология</p>
        </header>
        <p id="feedStatus" class="status-text" data-i18n="feed.loading">Загрузка ленты...</p>
        <ul id="feedList" class="feed-list"></ul>
      </section>
    </main>
  </body>
</html>
